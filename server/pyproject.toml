[project]
name = "ontology-lifecycle-api"
version = "1.0.0"
description = "Python API and LangGraph runtime for the AI governance ontology demo"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "langgraph>=1.0,<2.0",
  "langgraph-checkpoint-mongodb>=0.5,<1.0",
  "pymongo>=4.10,<5.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[tool.uv]
package = false
